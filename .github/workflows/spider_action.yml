name: Spider Data Collection

on:
  workflow_dispatch: # 仅允许手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install "flake8==7.3.0"
          flake8 spider.py tests/ --count --show-source --statistics

      - name: Run tests
        run: |
          pip install "pytest==9.0.3"
          pytest -v

      - name: Run Spider 🤖
        run: |
          python spider.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Update atlas route
        run: |
          make build-atlas-route
          make check-atlas-route
          pytest tests/test_atlas_data.py -v

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z $(git status -s) ]]; then
            echo "No changes to commit"
            exit 0
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .
          git commit -m "Update assets [skip ci]" -m "Automated update via GitHub Actions"
          git push
